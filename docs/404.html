<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orvyn</title>
    <meta name="description" content="Cryptographic Attribution & Immutable Decryption Provenance for Multi-Recipient Encrypted Document Distribution." />
    <meta property="og:title" content="Orvyn" />
    <meta property="og:description" content="Cryptographic Attribution & Immutable Decryption Provenance for Multi-Recipient Encrypted Document Distribution." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body class="bg-[#090d16] text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root"></div>
    <script>
      // Fallback for static hosts (e.g. GitHub Pages root deployment where /src/main.tsx cannot be run without Vite)
      if (!window.location.hostname.includes('run.app') && window.location.port !== '3000' && window.location.hostname !== 'localhost') {
        window.addEventListener('DOMContentLoaded', () => {
          setTimeout(() => {
            const root = document.getElementById('root');
            if (root && !root.hasChildNodes()) {
              console.log('Detected static hosting environment without active dev server. Loading production bundle...');
              if (!document.querySelector('link[href*="index.css"]')) {
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.crossOrigin = 'anonymous';
                link.href = './assets/index.css';
                document.head.appendChild(link);
              }
              const script = document.createElement('script');
              script.type = 'module';
              script.crossOrigin = 'anonymous';
              script.src = './assets/index.js';
              document.body.appendChild(script);
            }
          }, 250);
        });
      }
    </script>
  </body>
</html>
